name: Task 8 Lockfile Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/task-8-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Commit synchronized Task 8 npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate synchronized lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit only the lockfile when changed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi

          test -z "$(git diff --name-only -- . ':!frontend/package-lock.json')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "build: synchronize Task 8 frontend package lock"
          git push origin "HEAD:${HEAD_BRANCH}"
