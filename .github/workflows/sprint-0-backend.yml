name: Sprint 0 Backend

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/sprint-0-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-tests:
    name: Backend health tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run health endpoint tests
        working-directory: backend
        env:
          NOVELFORGE_DB_PATH: ${{ runner.temp }}/writers-room-health.db
          BOOTSTRAP_OVERWRITE: "false"
        run: python -m pytest tests/test_health.py -v

  backend-image:
    name: Backend image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t writers-room-backend:spike backend

      - name: Start backend container
        run: |
          docker run --rm -d \
            --name writers-room-backend-spike \
            -p 127.0.0.1:54321:54321 \
            -e NOVELFORGE_DB_PATH=/data/novelforge.db \
            -e BOOTSTRAP_OVERWRITE=false \
            -v writers-room-backend-ci-data:/data \
            writers-room-backend:spike

      - name: Wait for readiness
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:54321/healthz/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs writers-room-backend-spike
            exit 1
          fi

      - name: Inspect container health
        run: |
          test "$(docker inspect --format='{{.State.Health.Status}}' writers-room-backend-spike)" = "healthy"

      - name: Clean up
        if: always()
        run: |
          docker rm -f writers-room-backend-spike 2>/dev/null || true
          docker volume rm writers-room-backend-ci-data 2>/dev/null || true
