name: Thinking p*rn

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/restore.sh"
      - "scripts/tests/test-restore-recovery.sh"
      - "scripts/verify-upstream.sh"
      - "scripts/check-local-exposure.sh"
      - "compose.yaml"
      - ".env.example"
      - "docs/acceptance/**"
      - ".github/workflows/stabilization-sprint-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend suite and Pydantic v2 gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run full backend suite with Pydantic deprecations as errors
        env:
          NOVELFORGE_DB_PATH: ${{ runner.temp }}/writers-room-stabilization.db
          BOOTSTRAP_OVERWRITE: "false"
        run: |
          PYTHONPATH=backend pytest -q backend/tests \
            -W error::pydantic.warnings.PydanticDeprecatedSince20

  frontend:
    name: Frontend suite, types, and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install committed frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run full Vitest suite
        working-directory: frontend
        run: npm test -- --run

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build production web bundle
        working-directory: frontend
        run: npm run build:web:container

  recovery-and-contracts:
    name: Recovery, source, exposure, and credential guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test restore recovery shell behavior
        run: bash scripts/tests/test-restore-recovery.sh

      - name: Verify upstream baseline
        run: bash scripts/verify-upstream.sh

      - name: Verify local-only exposure contract
        run: |
          cp .env.example .env
          bash scripts/check-local-exposure.sh

      - name: Reject tracked OpenRouter credential shapes without printing matches
        shell: bash
        run: |
          set -euo pipefail
          if git grep -qE 'sk-or-v1-[A-Za-z0-9_-]{20,}' -- .; then
            echo 'FAIL: tracked OpenRouter credential pattern found' >&2
            exit 1
          fi
