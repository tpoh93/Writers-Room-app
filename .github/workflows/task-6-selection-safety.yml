name: Task 6 Selection Safety

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/renderer/src/utils/selectionPatch.ts"
      - "frontend/src/renderer/src/utils/__tests__/selectionPatch.test.ts"
      - "backend/app/services/text_patch_service.py"
      - "backend/tests/services/test_text_patch_service.py"
      - ".github/workflows/task-6-selection-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection-safety:
    name: Frontend and backend selection safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install committed frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run selection safety tests
        working-directory: frontend
        run: npm test -- selectionPatch.test.ts

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend selection safety tests
        working-directory: backend
        run: python -m pytest tests/services/test_text_patch_service.py -v
