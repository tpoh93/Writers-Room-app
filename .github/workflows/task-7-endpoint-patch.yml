name: Task 7 Endpoint Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/task7_patch_workflow_endpoints.py"
      - ".github/workflows/task-7-endpoint-patch.yml"

permissions:
  contents: write

jobs:
  apply-endpoint-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply guarded workflow endpoint patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair one-shot duplicate route selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/task7_patch_workflow_endpoints.py")
          text = path.read_text(encoding="utf-8")
          old = '''    count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)
          '''
          new = '''    count = text.count(old)
              if label == "remove late duplicate get_run" and count == 2:
                  before, separator, after = text.rpartition(old)
                  if not separator:
                      raise RuntimeError(f"{label}: late route was not found")
                  text = before + new + after
                  return
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)
          '''
          if text.count(old) != 1:
              raise RuntimeError("replace_once implementation changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply guarded patch
        run: python scripts/task7_patch_workflow_endpoints.py

      - name: Restore one-shot helper
        run: git checkout -- scripts/task7_patch_workflow_endpoints.py

      - name: Compile patched endpoint module
        run: python -m compileall -q backend/app/api/endpoints/workflows.py

      - name: Verify exact mutation scope
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "backend/app/api/endpoints/workflows.py"
          git diff --check

      - name: Commit patched endpoint module
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/endpoints/workflows.py
          git commit -m "feat: add parameterized workflow run endpoints"
          git push origin "HEAD:${HEAD_BRANCH}"
