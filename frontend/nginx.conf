server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location = /healthz/frontend {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /healthz/live {
        access_log off;
        proxy_pass http://backend:54321/healthz/live;
        proxy_set_header Host $host;
    }

    location = /healthz/ready {
        access_log off;
        proxy_pass http://backend:54321/healthz/ready;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:54321/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /imgs/ {
        proxy_pass http://backend:54321/imgs/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
